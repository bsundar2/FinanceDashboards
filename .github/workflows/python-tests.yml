name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.11: pandas is pinned to 2.2.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # The formula tests in tests/test_budget_template.py recalculate the
      # workbook in LibreOffice and skip without it. The install is a large
      # download, so on pull requests it only happens when the template, its
      # migration, those tests or this workflow change; pushes to main always
      # run them.
      - name: Check whether the formula tests are needed
        id: formulas
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(src/budget_|tests/test_budget_template|\.github/workflows/python-tests)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install LibreOffice Calc
        if: steps.formulas.outputs.needed == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Run tests
        run: python -m pytest tests/ -q
