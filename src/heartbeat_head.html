<!-- Added to both notebooks' <head> (html_head_file). While a page is open it
     pings the server every 4 minutes. Render's free plan stops a service that
     gets no inbound request for 15 minutes, and an open websocket doesn't
     seem to count, which kills the kernel behind a page left on its own.
     Standalone `marimo run` has no /heartbeat route; the 404 is harmless. -->
<!-- PWA: marimo's own <link rel="manifest" href="./manifest.json"> is the one Chrome
     reads, and PasswordGate answers it with src/pwa/manifest.webmanifest. Lets Chrome offer "Install app" (served unauthenticated by PasswordGate,
     since browsers fetch the manifest and icons without the login cookie). -->
<meta name="theme-color" content="#0a0c0f">
<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function () {});
  }
  setInterval(function () {
    fetch("/heartbeat", { credentials: "same-origin", cache: "no-store" }).catch(function () {});
  }, 4 * 60 * 1000);
</script>

<!-- Loading screen: dark from the first paint (the page is white until the
     notebook's own styles load), and marimo's spinning-circle loader swapped
     for dollar bills fluttering down. Only the big page loader is replaced
     (marimo marks it data-testid="large-spinner"); if marimo changes it, the spinner just stays.
     The same bills fill the small "cells are running" indicator, centered by the CSS below. -->
<style>
  html, body, #root { background: #0a0c0f !important; }
  /* marimo's "running" indicator: the bills in the middle of the screen
     instead of its hourglass in the top-left corner. Here rather than in the
     notebooks' STYLE, which only arrives once the first cell has run, so the
     indicator is centered from the very first load. Like the hourglass it
     only appears once cells have run for a second, so a quick dropdown change
     doesn't flash it. */
  [data-testid="loading-indicator"] {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 120px;
    height: 106px;
    margin: -53px 0 0 -60px;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 0 0 10px rgba(10, 12, 15, 0.85);
    background: rgba(10, 12, 15, 0.85);
    animation: t-appear 0.2s ease-out 1s both;
  }
  [data-testid="loading-indicator"] .running-app-icon { display: none; }
  @keyframes t-appear { from { opacity: 0; } to { opacity: 1; } }
  .money-loader { display: flex; justify-content: center; }
  .money-loader .bill {
    animation: money-flutter 2.4s linear infinite;
    transform: translate(var(--x), -15px) rotate(-25deg);
    opacity: 0;
  }
  @keyframes money-flutter {
    0% { transform: translate(var(--x), -15px) rotate(-25deg); opacity: 0; }
    10% { opacity: 1; }
    25% { transform: translate(calc(var(--x) + 14px), 30px) rotate(25deg); }
    50% { transform: translate(calc(var(--x) - 12px), 70px) rotate(-20deg); }
    75% { transform: translate(calc(var(--x) + 12px), 110px) rotate(20deg); }
    90% { opacity: 1; }
    100% { transform: translate(var(--x), 150px) rotate(-15deg); opacity: 0; }
  }
</style>
<script>
  (function () {
    var bills = [[28, 0], [63, 0.45], [98, 0.9], [133, 1.35]].map(function (b, i) {
      return '<g class="bill" style="--x:' + b[0] + 'px;animation-delay:-' + b[1] + 's;animation-duration:' + (2.2 + (i % 2) * 0.4) + 's">' +
        '<rect x="-17" y="-9" width="34" height="18" rx="2.5" fill="#3fa468" stroke="#1f6b41" stroke-width="1.5"/>' +
        '<circle r="5" fill="#2b8654" stroke="#bfe8cf" stroke-width="1"/>' +
        '<text y="3.2" text-anchor="middle" font-size="8" font-weight="700" fill="#e9fbf0">$</text></g>';
    }).join("");
    var markup = '<svg viewBox="0 0 170 150" width="120" height="106" role="img" aria-label="Loading">' + bills + '</svg>';
    function swap() {
      document.querySelectorAll('svg.animate-spin[data-testid="large-spinner"]').forEach(function (spinner) {
        var box = document.createElement("div");
        box.className = "money-loader";
        box.innerHTML = markup;
        spinner.replaceWith(box);
      });
      // The "cells are running" indicator: marimo's icon in it is hidden by the
      // CSS above, so put the bills in instead
      document.querySelectorAll('[data-testid="loading-indicator"]').forEach(function (ind) {
        if (ind.querySelector(".money-loader")) return;
        var box = document.createElement("div");
        box.className = "money-loader";
        box.innerHTML = markup;
        ind.appendChild(box);
      });
    }
    new MutationObserver(swap).observe(document.documentElement, { childList: true, subtree: true });
    swap();
  })();
</script>
