services:
  # The Yearly Overview at /, and its Net Worth page at /net-worth, behind one
  # password (see src/dashboard_server.py)
  - type: web
    name: finance-dashboards
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn --factory src.dashboard_server:create_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FINANCE_TOKEN
        sync: false
      # Upload data/gsheets_authentication.json as a Secret File named
      # gsheets_authentication.json; Render mounts secret files here
      - key: GSHEETS_AUTH_FILE
        value: /etc/secrets/gsheets_authentication.json
      - key: BUDGET_SPREADSHEET_NAME
        value: Budget - 2026
      # The spreadsheet with the SimpleFIN pipeline's holdings_dump tab
      # (optional: the Net Worth page falls back to balances without it)
      - key: HOLDINGS_SPREADSHEET_NAME
        value: RH_Sheets
      # FinanceToSheets's P&L tracker and SplitwiseToSheets's spending
      # dashboard, linked from the menu bar
      - key: PNL_DASHBOARD_URL
        sync: false
      - key: SPENDING_DASHBOARD_URL
        sync: false
